name: Security

# Kept out of ci.yml on purpose: these checks are slower and mostly independent
# of a given change, and a weekly cron matters as much as the per-PR run — a CVE
# is disclosed against code you have not touched.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Mondays 06:00 UTC, alongside the Dependabot run.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR tag for the image scan (staging-latest = what develop last deployed)"
        required: false
        default: staging-latest

# Least privilege by default; the two jobs that need more (CodeQL uploading
# results, the image scan pulling from GHCR) raise it for themselves only.
permissions:
  contents: read

jobs:
  # ── Secret scanning ────────────────────────────────────────────────────────
  # The history is clean today (only .env.example files were ever committed).
  # The point of this job is to keep it that way: a secret pushed once is
  # compromised forever, because rewriting history does not un-publish it.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history, not just the tip: a key added and later "removed" in a
          # follow-up commit is still sitting in the objects, still valid, and is
          # exactly what this job must catch.
          fetch-depth: 0

      # Run the binary via its own image rather than gitleaks-action, which asks
      # organisations for a licence key. Same scanner, no licensing surface.
      - name: Run gitleaks
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code=1

  # ── Dependency vulnerabilities ─────────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # BLOCKING. These are the packages installed into the runtime images and
      # serving customer traffic, so a high/critical advisory here is a live
      # exposure. The gate fails on any NEW one, while letting through a short,
      # dated, task-linked allowlist (today: the six advisories discharged by the
      # NestJS 10 → 11 upgrade, TASK-304). A plain `--audit-level=high` would be
      # red on every PR until that lands, and a permanently red gate is one
      # everyone learns to ignore. Exemptions expire; see scripts/audit-gate.js.
      - name: Audit production dependencies (blocking)
        run: node scripts/audit-gate.js

      # NON-BLOCKING, on purpose. Dev/test tooling never ships: a vulnerable
      # jest transitive dependency cannot be reached by an attacker over the
      # internet. Failing the build on those trains everyone to ignore a red
      # security job, which costs more than it buys. Reported, not enforced.
      - name: Audit all dependencies (report only)
        if: always()
        continue-on-error: true
        run: |
          echo '### npm audit — all dependencies (dev included, informational)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=moderate 2>&1 | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Container / IaC misconfiguration ───────────────────────────────────────
  # Scans the Dockerfiles and compose files for hardening mistakes (running as
  # root, writable filesystems, exposed ports, missing healthchecks) and the
  # lockfile for known-vulnerable packages.
  trivy:
    name: Trivy (config + dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Dockerfiles and compose config
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          # Config findings are advisory here: several are deliberate (e.g. the
          # dev compose file binds ports to the host on purpose). Read them in
          # the job log rather than letting them gate the pipeline.
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Scan dependencies for known CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ── Static analysis (TASK-452) ─────────────────────────────────────────────
  # CodeQL's JS/TS queries: injection, SSRF, open redirect, prototype pollution,
  # insecure randomness and the like, traced across the three apps. Free since
  # the repository went public (on a private repo it needs GitHub Advanced
  # Security). Findings land in Security → Code scanning rather than failing this
  # job; whether a new alert blocks a merge is a branch-protection setting
  # ("Code scanning results" as a required check), not something to encode here.
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload SARIF to code scanning.
      security-events: write
      # Read the run's own metadata (only required on private repos).
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Interpreted language: CodeQL reads the sources directly, so no
          # `npm ci` and no build — and no Orval output, which is gitignored
          # generated code and not ours to review.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ── New-dependency gate on pull requests (TASK-452) ────────────────────────
  # Diffs the PR's lockfile against its base and fails on a newly ADDED
  # dependency with a known high/critical advisory — the moment it is cheapest to
  # say no. Nominally the same line as the blocking `npm audit` gate above —
  # high and critical, runtime scope only (dev tooling never ships).
  #
  # NOT the same line in practice, and it is worth knowing which way it leans:
  # GitHub's dependency graph scopes a package by how it ENTERS the manifest, so
  # the ESLint chain is `development` to it, while `npm audit --omit=dev` walks
  # it as production because the root links `packages/eslint-config` as a
  # workspace dependency (the quirk scripts/audit-gate.js documents at length).
  # So `fail-on-scopes: runtime` never sees the class of advisory audit-gate has
  # to allowlist — this gate is the narrower of the two, not an equal one.
  #
  # It complements that gate rather than duplicating it: audit-gate judges the
  # whole tree on every run, this one only what the PR introduces.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          # A PR comment would need `pull-requests: write`; the job summary
          # carries the same table.
          comment-summary-in-pr: never

  # ── Built-image scan (TASK-452) ────────────────────────────────────────────
  # The `trivy` job above reads the repo; this one reads what actually ships —
  # the three images ci.yml's staging deploy pushes to GHCR — so it also sees the
  # OS packages of the node base image, which no lockfile lists.
  #
  # Advisory like the other Trivy scans (exit-code 0: read the log/summary), and
  # scheduled rather than per-push: an image's CVE count changes when advisories
  # are published, not when we commit, and the weekly cron is what catches that.
  image-scan:
    name: Trivy image (${{ matrix.image }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull the images from GHCR with the workflow token.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [store-api, store-client, store-admin]
    env:
      # `inputs` is empty on the cron run, so fall back to the develop tag.
      IMAGE_TAG: ${{ inputs.image_tag || 'staging-latest' }}
    steps:
      # Same coordinates as ci.yml's deploy jobs: GHCR paths must be lowercase and
      # the owner renders mixed-case (keep in sync with ci.yml and
      # docker-compose.staging.yml).
      - name: Compute image reference
        id: img
        run: |
          owner_lc="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner_lc}/${{ matrix.image }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Until a staging deploy has pushed the tag there is nothing to scan (no
      # deploy has run while Actions was locked, TASK-491). Say so in the summary
      # instead of going red: a missing image is not a vulnerability.
      #
      # ONLY a missing image, though. Treating every non-zero exit as "not
      # found" — which is what a bare `if docker manifest inspect` does — makes
      # a registry 5xx, an expired token or a CLI change look exactly like an
      # image that was never pushed, and the job then reports green while
      # scanning nothing, for as long as the condition lasts. So: inspect the
      # error, skip on a real "unknown manifest" (or 404/denied for a tag that
      # does not exist yet), and fail on anything else.
      - name: Check the image exists
        id: exists
        env:
          REF: ${{ steps.img.outputs.ref }}
        run: |
          set +e
          err="$(docker manifest inspect "$REF" 2>&1 >/dev/null)"
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$err" in
            *MANIFEST_UNKNOWN*|*manifest\ unknown*|*not\ found*|*NAME_UNKNOWN*|*denied*)
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "::warning::$REF not found in GHCR — nothing to scan."
              echo "### ${{ matrix.image }}: \`$REF\` not found — skipped" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Could not reach GHCR for $REF — this is NOT 'no image yet'."
              echo "$err"
              exit 1
              ;;
          esac

      - name: Scan the image for known CVEs
        if: steps.exists.outputs.found == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        env:
          # Trivy pulls the image itself; these are its registry credentials.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ steps.img.outputs.ref }}
          scanners: vuln
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
