name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Lets a production deploy be re-run without a new commit — e.g. after fixing a
  # secret, or to roll back by re-running an older commit's workflow. Without this
  # the `workflow_dispatch` condition on deploy-production could never be true.
  workflow_dispatch:

# Least privilege by default. The three jobs that need more (changes, and the
# two deploys) widen it themselves; the other eleven only read the checkout.
permissions:
  contents: read

# ────────────────────────────────────────────────────────────────────────────
# API CONTRACT & CODEGEN (TASK-325) — why these jobs look the way they do.
#
# ~116 frontend source files import Orval-generated hooks from
# `**/shared/api/generated/`, which is codegen output and stays untracked. The
# input it is generated from — `apps/store-api/swagger.json` — IS tracked, so a
# bare `npm ci` checkout has everything needed to produce the hooks offline.
# (It used to be gitignored too; that combination made typecheck/lint/build/
# test-unit impossible to pass on a clean checkout, and they were red from
# 2026-06-30 until this was fixed.)
#
# TWO codegens have to happen before any of these commands, not one:
#   1. `prisma generate` — @prisma/client is generated, and nothing installs it
#      for you here (the schema's datasource url lives in prisma.config.ts, so
#      Prisma's own postinstall does not fire). Without it `npm run typecheck`
#      fails with ~595 errors like "Module '@prisma/client' has no exported
#      member 'Prisma'". Only the `build` job ever ran it; typecheck/lint/
#      test-unit did not, so fixing the spec alone would have left them red.
#   2. `npm run generate:api` — orval, reading the committed spec.
#
# Neither is a step here. Root `pretypecheck` / `prelint` / `prebuild` /
# `pretest` in package.json both run `npm run codegen`, which does the pair
# (~0.3s + ~8-10s). Single-sourcing it this way means the guarantee holds for a
# fresh local clone too, and no future job can forget half of it. A failure
# shows up inside the `npm run <script>` step with the tool's own error.
#
# `npm run codegen` invokes prisma from the REPO ROOT
# (`--schema=apps/store-api/prisma/schema.prisma`) on purpose: run from
# apps/store-api instead, prisma picks up prisma.config.ts and dies with
# "Cannot resolve environment variable: DATABASE_URL" — which is why the
# workspace's own `db:generate` script cannot be used here.
#
# node-version is 22 (not 20) on every job that ends up running orval:
# orval@8.21 declares `engines.node >= 22.18` and refuses to start on 20.
# ────────────────────────────────────────────────────────────────────────────
#
# ────────────────────────────────────────────────────────────────────────────
# ONE PIPELINE, NOT A SPLIT MONOREPO (TASK-455) — and what that means here.
#
# The repo stays one monorepo on purpose: the OpenAPI → Orval contract is caught
# inside a single PR, the production deploy already builds only the images whose
# inputs changed (see deploy-production), and the team is one person. What a
# split would have bought — "a docs change does not rebuild the world" — is
# bought here by the `changes` job instead:
#
#   - `changes` decides whether anything OTHER than documentation changed.
#   - The heavy roots (typecheck, lint, contract-freshness) run only when it
#     did; build, test-unit, test-e2e, test-e2e-playwright and test-int hang off
#     those roots through `needs:` and are skipped with them.
#   - Cheap zero-dependency gates (lockfile-platform, env-drift, docs-links) are
#     NOT filtered: they cost seconds, and env-drift even READS a doc
#     (docs/deploy/04a-env-matrix.md), so a "docs-only" change can break it.
#
# CACHES beyond `cache: npm` — added only where a measurement said it pays:
#   - Playwright browsers: yes (test-e2e-playwright; the one big download).
#   - Next.js `.next/cache` in `build`: no — see the comment on that job
#     (~0.7 MB after a Turbopack build; nothing to restore).
#   - Prisma engines: no. Prisma 7 fetches a single ~20 MB schema-engine
#     binary during `npm ci` — seconds. Not worth a cache step in eight jobs
#     whose key would have to be scraped out of the lockfile before `npm ci`.
#   - The Turbopack DEV cache the Playwright web servers build (~690 MB per
#     app): no — two of those per run would evict everything else from the
#     repo's 10 GB cache allowance for a non-blocking job.
#
# BRANCH PROTECTION — a skipped job reports its check as "skipped", and GitHub
# counts "skipped" as PASSING for a required status check. That is what lets a
# docs-only PR merge while its build/test checks were never run, and it is
# intended. The flip side: a job skipped by MISTAKE passes just as green. Two
# things guard against that. The filter fails OPEN (anything it cannot
# classify, and a filter step that errors out, count as code). And
# `Detect Changes` itself must be required: if the job still FAILS (say, the
# checkout), every job below it is skipped, not failed — without it on the
# list that would read as an all-green PR.
#
# Checks to mark REQUIRED on `develop` and `main` (a repo setting the owner
# changes — nothing in this file can enforce it):
#   CI:       Detect Changes, Type Check, Lint, Build, Unit Tests, E2E Tests,
#             Integration Tests, OpenAPI Contract Freshness,
#             Lockfile Platform Coverage, Env Drift Gate, Docs Links
#   Security: Secret scan (gitleaks), npm audit, CodeQL (javascript-typescript),
#             Dependency review (PR-only — it does not run on push, so require
#             it for pull requests only)
# NOT required: E2E Tests (Playwright) — continue-on-error, see that job — and
# the advisory Trivy scans in security.yml.
# ────────────────────────────────────────────────────────────────────────────
jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # changes (TASK-455) — "did anything besides documentation change?"
  #
  # Inverted on purpose: the filter lists what is DOCUMENTATION, and every
  # other path counts as code. A list of code paths would have to be kept in
  # step with every new top-level file (tsconfig, .nvmrc, compose, Caddyfile…)
  # and would fail CLOSED the day someone forgot one — tests silently skipped.
  # This way a forgotten path costs one unnecessary full run, never a missed one.
  #
  # FORCED FULL RUN on a push to `main` and on `workflow_dispatch`: those are
  # the two paths into deploy-production, which `needs:` the test jobs — a
  # skipped test job would skip the deploy with it, and a manual re-run is
  # exactly the case where "nothing changed" is the point. On `develop` a
  # docs-only push skips the tests and therefore deploy-staging too, which is
  # correct: the images would be identical to the ones already running.
  # ──────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a PR's files through the REST API on pull_request.
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changed paths
        id: filter
        if: >-
          github.event_name != 'workflow_dispatch'
          && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        # A filter that breaks (API hiccup, missing base commit) must not skip
        # the tests: the step is allowed to fail, and `Resolve scope` then
        # treats the missing output as "code changed".
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          # REQUIRED on push. Without `base` the action falls back to the
          # repository's DEFAULT branch (`main`), so a push to develop is diffed
          # against its merge-base with main — i.e. against the last release,
          # which always contains code. `code` would then be true on every
          # develop push and the docs-only skip below would never once fire.
          # Naming the branch that was pushed to is what makes the action diff
          # against the commit before the push. Ignored on pull_request, where
          # the action lists the PR's files through the API instead.
          base: ${{ github.ref_name }}
          # `every`: a file counts as code only if it matches ALL patterns —
          # i.e. it is anything (`**`) that is not one of the negated doc paths.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
      - name: Resolve scope
        id: scope
        # Through env, never interpolated into the script: github.ref is a branch
        # name, and workflow_dispatch accepts any branch.
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTERED: ${{ steps.filter.outputs.code }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$FILTER_OUTCOME" = "skipped" ]; then
            echo "Forced full run ($EVENT on $REF)."
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif [ "$FILTERED" = "false" ]; then
            echo "Documentation-only change: build and test jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            # "true", or anything unexpected (the filter failed, empty output)
            # — fail open.
            if [ "$FILTER_OUTCOME" != "success" ]; then
              echo "::warning::paths-filter did not succeed ($FILTER_OUTCOME) — running everything."
            fi
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `pretypecheck` runs `npm run codegen` (prisma generate + orval) first.
      - run: npm run typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # lockfile-platform (TASK-326) — package-lock.json must stay Linux-buildable.
  #
  # lightningcss and @tailwindcss/oxide ship their native addon as per-platform
  # optional packages. npm records only the ones installable on the machine that
  # resolved the tree, and this lockfile is maintained on Windows — so it held
  # only the *-win32-x64-msvc entries, `npm ci` on ubuntu installed no addon at
  # all, and `next build` died with
  #   Cannot find module '../lightningcss.linux-x64-gnu.node'
  # Both frontend images were unbuildable.
  #
  # Root `optionalDependencies` in package.json now pin the Linux packages, but
  # THAT ALONE IS NOT DURABLE: the next `npm install` on a Windows machine can
  # prune them straight back out, silently, and nobody would notice until a
  # deploy failed. This job is the durable half — it is the actual deliverable,
  # not the lockfile edit.
  #
  # Pure node, no dependencies, so it needs neither `npm ci` nor a service.
  # ──────────────────────────────────────────────────────────────────────────
  lockfile-platform:
    name: Lockfile Platform Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-lockfile-platforms.js

  # Five sources of truth describe the same environment variables — both compose
  # files, .env.production.example, env.validation.ts, the frontend Dockerfiles
  # and the `build-args:` lists of THIS file's image builds (TASK-494) — plus the
  # application code that reads them, and nothing used to compare them. That is
  # how STORE_CLIENT_URL, REVALIDATE_SECRET and GOOGLE_* all ended up read by
  # code but never delivered in production (TASK-324), and how the Sentry build
  # args never reached a deployed frontend (TASK-737). Zero deps, so no `npm ci`.
  #
  # The unit tests of the zero-dependency scripts run here too (node:test, no
  # installs). A glob, not a directory: since Node 21 `node --test <dir>` treats
  # the directory as a module path and fails with MODULE_NOT_FOUND.
  env-drift:
    name: Env Drift Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/env-check.js --audit
      - name: Unit tests of the repo scripts
        run: node --test "scripts/__tests__/*.test.js"

  # ──────────────────────────────────────────────────────────────────────────
  # docs-links (TASK-453 wrote the checker, TASK-455 wires it) — every repo path
  # the living docs mention must exist.
  #
  # Deliberately NOT behind the `changes` filter, although it is about docs:
  # the commonest way to break a doc link is a CODE change — a script renamed,
  # a folder moved — in a commit that never opens the doc that pointed at it.
  # Filtering on docs/** would miss exactly that. It costs a few seconds.
  #
  # Zero dependencies (fs/path/child_process only), so no `npm ci`: `npm run`
  # only reads package.json. It does call `git check-ignore`, which is why it
  # needs the checkout rather than a bare download.
  # ──────────────────────────────────────────────────────────────────────────
  docs-links:
    name: Docs Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run docs:links

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `prelint` runs `npm run codegen` (prisma generate + orval) first.
      - run: npm run lint

  # Skipped on a docs-only change through `needs:` — typecheck and lint carry
  # the `changes` condition, and a job whose need was skipped is skipped too.
  #
  # No `.next/cache` cache here, on measurement (TASK-455): Next 16 builds with
  # Turbopack, whose persistent build cache is opt-in and experimental
  # (`experimental.turbopackFileSystemCacheForBuild`, default false). Without it
  # `next build` leaves ~0.7 MB in .next/cache (a config file and devtools
  # state) — nothing a restore could speed up. Worth adding the day that flag is
  # turned on; until then it would be a cache step that only looks useful.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Redundant since `prebuild` now does it too, but harmless (242ms) and it
      # keeps the Prisma step visible in the log of the job most likely to be
      # read when a build breaks.
      - run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      # `prebuild` runs `npm run codegen` (prisma generate + orval) first.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_CURRENCY: UAH
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3002

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Root `test` delegates to all three workspaces — store-api (Jest),
      # store-client (Jest unit + RTL/MSW component projects), store-admin (Jest).
      # `pretest` runs `npm run codegen` (prisma generate + orval) first.
      - run: npm run test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      # `--config`, not `--schema`: schema.prisma's datasource block carries no url
      # (it comes from prisma.config.ts), so a root-cwd `--schema` invocation fails
      # with "datasource.url property is required" before applying anything (TASK-303).
      - run: npx prisma migrate deploy --config apps/store-api/prisma.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_test
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_test

  test-e2e-playwright:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-unit]
    # Non-blocking while the suite is not green. The rule (TASK-455): this line
    # goes — and the job joins the deploy jobs' `needs:` — only after THREE
    # consecutive full local runs pass, not on a feeling that it is stable.
    #
    # Evidence 2026-09-19 (chore/452-quality, fresh Postgres 17 + migrated
    # store_test, 31 tests, 1 worker, no retries): 0 of 3 runs green —
    # 7 / 5 / 5 failures. Five fail 3 of 3, so they are not flakes but the
    # specs and the storefront disagreeing:
    #   - responsive `/products fits 320px` — the page really scrolls sideways
    #     (scrollWidth 331 > 320; the catalog toolbar and its sort button);
    #   - responsive `/cart fits 320/360/390px` — the empty cart renders its
    #     title as an h2, so the `#main-content h1` readiness gate never shows;
    #   - theme `the dark: utilities follow the explicit choice` — the catalog
    #     search is now labelled «Пошук товарів», and the spec looks for an
    #     exact «Пошук».
    # The other two failed only on the first, cold run (auth-flow login and
    # the admin deep-linked ?status filter — both left on /login while the dev
    # servers compiled on demand), which CI's `retries: 2` would likely absorb.
    # Re-measure after those are fixed; the backlog row carries the details.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_test
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      # `--config`, not `--schema`: schema.prisma's datasource block carries no url
      # (it comes from prisma.config.ts), so a root-cwd `--schema` invocation fails
      # with "datasource.url property is required" before applying anything (TASK-303).
      - run: npx prisma migrate deploy --config apps/store-api/prisma.config.ts
      # Browser cache (TASK-455). The Chromium download is the one sizeable
      # fetch in this job that npm's cache does not cover. Keyed on the
      # INSTALLED @playwright/test version, not on the lockfile: each Playwright
      # release pins its own browser revision, so the version is exactly what
      # decides whether a cached browser still fits — an unrelated dependency
      # bump keeps the hit. The OS libraries live outside the cached directory
      # (apt), so a hit still installs those, just without the download.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium with its OS dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium OS dependencies (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # playwright.config.ts boots the API + storefront + admin panel (webServer)
      # and seeds the DB via globalSetup before running the specs.
      - run: npm run test:e2e:pw

  test-int:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis is NOT optional here (TASK-460). `cache.int-spec.ts` exists to
      # exercise the REAL Redis path — SCAN-based prefix eviction and the
      # round-trip through @keyv/redis — and it defaults REDIS_HOST to
      # `localhost` itself, so with no service the cache module still takes the
      # Redis branch and simply talks to nothing. CacheService then swallows
      # every failure as designed, turning what should be a cache hit into a
      # second repository call: the suite failed on an assertion about caching
      # while the real cause was a missing container. The in-memory fallback is
      # not a substitute — it would hide exactly the code this spec covers.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      # `--config`, not `--schema`: schema.prisma's datasource block carries no url
      # (it comes from prisma.config.ts), so a root-cwd `--schema` invocation fails
      # with "datasource.url property is required" before applying anything (TASK-303).
      - run: npx prisma migrate deploy --config apps/store-api/prisma.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_test
      - run: npm run test:int -w apps/store-api
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/store_test
          # Set explicitly rather than relying on the spec's own `?? 'localhost'`
          # default, so the job says out loud which service it needs.
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ──────────────────────────────────────────────────────────────────────────
  # contract-freshness (TASK-325) — the committed OpenAPI spec must match the
  # code that produces it.
  #
  # `apps/store-api/swagger.json` is tracked, and the frontends' typed hooks are
  # generated from it. That buys a green clean checkout, but it introduces one
  # new failure mode: change a DTO or a controller, forget to re-export, and the
  # frontends keep compiling happily against a contract the API no longer serves.
  # Nothing else catches that — the hooks would be internally consistent, just
  # wrong. This job re-exports the spec and fails if the result differs from what
  # is committed.
  #
  # Needs only `changes` (seconds), so it still reports independently and early,
  # and is skipped with the other code jobs on a docs-only change. It is
  # deliberately NOT in the deploy jobs' `needs:` — those export the spec
  # themselves before building images, so a stale committed spec cannot reach an
  # image. The risk this covers is drift in the repo, not in a deployment.
  #
  # node 20 is fine here: this job never runs orval (which needs >= 22.18), only
  # ts-node + Nest, exactly like the deploy jobs' export step.
  # ──────────────────────────────────────────────────────────────────────────
  contract-freshness:
    name: OpenAPI Contract Freshness
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    services:
      # Throwaway Postgres — ONLY so `swagger:export` can boot AppModule
      # (PrismaService.$connect() opens a real connection). No schema or tables
      # are needed: the export connects, then reads Swagger decorator metadata,
      # and SearchService.onModuleInit returns early when Meili is unconfigured,
      # so nothing queries a table at boot. Mirrors the deploy jobs' env.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_swagger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      # The dummy secrets are throwaway build-time inputs for env validation —
      # never used at runtime, and the app never listens on a port here.
      #
      # ⚠️ EVERY variable below is REQUIRED to boot with NODE_ENV=production.
      # env.validation.ts is the list; the ones that have bitten us are:
      #   - CSRF_SECRET, min 32 chars (TASK-325)
      #   - STORE_CLIENT_URL, an exact origin — no path, no trailing slash
      #     (required since 1fdeecd / TASK-324)
      #   - REVALIDATE_SECRET (min 32) and STOREFRONT_REVALIDATE_URL, required
      #     since 866834e / TASK-383
      #   - STORE_ADMIN_URL, an exact origin like STORE_CLIENT_URL (TASK-674) —
      #     added to all three blocks in the same commit that made it required
      # The last three were never added here, so this job — and the two export
      # steps below — have been dying before reaching any Swagger metadata with
      #   "Invalid environment configuration: STORE_CLIENT_URL is required in
      #    production; REVALIDATE_SECRET is required in production;
      #    STOREFRONT_REVALIDATE_URL is required in production"
      # (TASK-461, reproduced locally). The three export steps now carry an
      # IDENTICAL env block: keep them that way — a variable added to the
      # validation schema has to land in all three or the next deploy dies
      # halfway, the way this one did.
      - name: Re-export the OpenAPI spec
        run: npm run swagger:export -w apps/store-api
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_swagger?schema=public
          JWT_SECRET: ci-dummy-jwt-secret-min-32-chars-000000
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-min-32-000
          CSRF_SECRET: ci-dummy-csrf-secret-min-32-chars-0000
          CORS_ORIGINS: http://localhost:3000
          STORE_CLIENT_URL: http://localhost:3000
          STORE_ADMIN_URL: http://localhost:3002
          REVALIDATE_SECRET: ci-dummy-revalidate-secret-min-32-0000
          STOREFRONT_REVALIDATE_URL: http://localhost:3000/api/revalidate
      - name: Committed spec must match the re-export
        run: |
          if ! git diff --exit-code -- apps/store-api/swagger.json; then
            echo ""
            echo "::error::apps/store-api/swagger.json is STALE — it does not match the API code."
            echo "The API surface changed but the committed OpenAPI contract was not updated,"
            echo "so the frontends are generating hooks against an API that no longer exists."
            echo ""
            echo "Fix it locally:"
            echo "  docker compose up -d postgres"
            echo "  npm run swagger:export -w apps/store-api"
            echo "  npm run generate:api      # refresh the hooks against the new spec"
            echo "  git add apps/store-api/swagger.json && git commit"
            exit 1
          fi
          echo "OpenAPI contract is in sync with the API code."

  # ──────────────────────────────────────────────────────────────────────────
  # deploy-staging (TASK-271) — build the three app images, push to GHCR, then
  # SSH into the staging VPS and roll the stack.
  #
  # TRIGGER: runs ONLY on a push to `develop` and ONLY after the blocking test
  # jobs above are green. The `needs:` graph IS the "after green CI" gate — no
  # extra webhook/polling. `test-e2e-playwright` is deliberately NOT in `needs:`
  # (it is `continue-on-error` and must never gate a deploy). It joins `needs:`
  # here and in deploy-production together with dropping continue-on-error —
  # the condition and the 2026-09-19 measurement are on that job (TASK-455).
  #
  # DOCS-ONLY PUSH (TASK-455): `changes` skips the test jobs, a skipped need
  # skips this job, and the run ends green with "Deploy to Staging: skipped".
  # That is the intended outcome, not a stuck pipeline — nothing that goes into
  # an image changed, so there is nothing to redeploy. The next code push
  # deploys as usual. deploy-production never sees this case: `changes` forces
  # a full run on `main` pushes and on workflow_dispatch.
  #
  # FIRST REAL DEPLOY IS MANUAL: this job cannot run until the owner provisions
  # the VPS, points DNS, and fills the `staging` GitHub Environment (4 secrets +
  # STAGING_DOMAIN). See docs/deploy/04-secrets-ci.md and docs/manual-qa-pending.md §16.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test-unit, test-e2e, test-int]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    concurrency:
      # One staging deploy at a time. cancel-in-progress:false QUEUES a second
      # push rather than killing an in-flight `docker compose up` (which could
      # leave the stack half-restarted).
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # push/pull GHCR images with the built-in GITHUB_TOKEN
    services:
      # Throwaway Postgres — ONLY so `swagger:export` can boot AppModule
      # (PrismaService.$connect() opens a real connection). No schema/tables are
      # needed: the export just connects and reads Swagger decorator metadata,
      # and SearchService.onModuleInit returns early when Meili is unconfigured,
      # so nothing queries a table at boot. Mirrors the test-e2e/test-int env.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_swagger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # ── does a staging stand exist yet? ──────────────────────────────────
      # FIRST, before anything is built or pushed. The three image builds below
      # carry `push: true` and run long before the first step that touches a
      # secret, so without this guard the first push to develop publishes
      # `store-{api,client,admin}:staging-latest` built with
      # NEXT_PUBLIC_API_URL=https://api. (empty STAGING_DOMAIN) and only THEN
      # goes red on an scp to an empty host. Those broken images then become
      # what the weekly Trivy image scan scans.
      #
      # A step rather than a job-level `if:`: STAGING_DOMAIN lives in the
      # `staging` Environment, and environment-scoped vars are not resolved yet
      # when `jobs.<id>.if` is evaluated — the job would stay skipped forever,
      # including after the owner fills it in.
      - name: Staging must be configured
        env:
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          missing=""
          [ -n "$STAGING_DOMAIN" ] || missing="$missing vars.STAGING_DOMAIN"
          [ -n "$SSH_HOST" ] || missing="$missing secrets.SSH_HOST"
          if [ -n "$missing" ]; then
            echo "::error::Staging is not provisioned yet — missing:$missing."
            echo "Nothing was built or published. Fill the 'staging' GitHub"
            echo "Environment (see docs/deploy/04-secrets-ci.md), or this job"
            echo "would push images built against an empty domain."
            exit 1
          fi
          echo "Staging target: $STAGING_DOMAIN"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # ── swagger.json re-export (runs before any docker build) ─────────────
      # apps/store-api/swagger.json is now COMMITTED (TASK-325), so a clean
      # checkout already contains a valid spec and this step is no longer load-
      # bearing — the store-client / store-admin Dockerfiles run
      # `npm run generate:api` INSIDE the image against the file in the build
      # context, and that file is present either way.
      #
      # It is kept anyway, on purpose. Re-exporting here makes the images a pure
      # function of the API SOURCE rather than of whatever spec happened to be
      # committed, so even a stale commit cannot ship mismatched hooks. The
      # `contract-freshness` job is what stops the two from drifting in the repo;
      # this step is the belt to that pair of braces on the one path where being
      # wrong is expensive.
      #
      # Mirrors the test jobs' env: `prisma generate` + a reachable Postgres +
      # the JWT secrets env validation requires. The dummy secrets below are
      # throwaway build-time inputs — never used at runtime.
      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      - name: Export OpenAPI spec into the build context
        run: npm run swagger:export -w apps/store-api
        env:
          # Identical to the contract-freshness job's block by design — see the
          # comment there. Every one of these is required, not optional:
          # env.validation refuses a production boot without them, and the export
          # exits 1 and takes the whole deploy with it. CSRF_SECRET was found
          # while closing TASK-325; CORS_ORIGINS, STORE_CLIENT_URL,
          # REVALIDATE_SECRET and STOREFRONT_REVALIDATE_URL while closing
          # TASK-461. All five were missing here and none of it ever surfaced,
          # because no deploy has ever run.
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_swagger?schema=public
          JWT_SECRET: ci-dummy-jwt-secret-min-32-chars-000000
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-min-32-000
          CSRF_SECRET: ci-dummy-csrf-secret-min-32-chars-0000
          CORS_ORIGINS: http://localhost:3000
          STORE_CLIENT_URL: http://localhost:3000
          STORE_ADMIN_URL: http://localhost:3002
          REVALIDATE_SECRET: ci-dummy-revalidate-secret-min-32-0000
          STOREFRONT_REVALIDATE_URL: http://localhost:3000/api/revalidate

      # ── image coordinates ────────────────────────────────────────────────
      # GHCR requires a LOWERCASE path; the repo owner renders mixed-case
      # (Oleksii-Bidiak), so lowercase it once here (keep in sync with
      # docker-compose.staging.yml).
      - name: Compute image coordinates
        id: img
        run: |
          owner_lc="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=staging-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image is tagged twice: an immutable staging-<sha> (used for rollback)
      # and a floating staging-latest. context is the monorepo root (npm
      # workspaces) exactly like plan 123's Dockerfiles expect.
      - name: Build & push store-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/store-api/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}/store-api:${{ steps.img.outputs.tag_sha }}
            ${{ steps.img.outputs.prefix }}/store-api:staging-latest
          cache-from: type=gha,scope=store-api
          cache-to: type=gha,mode=max,scope=store-api

      # NEXT_PUBLIC_* are BAKED at build time → these images are tied to the
      # staging domain and can never be promoted to prod (prod builds its own).
      # Values come from the `staging` Environment's variables (public URLs, not
      # secrets — SENTRY_AUTH_TOKEN is the one exception and comes from the
      # Environment's `secrets.*`). Optional vars (Sentry/Umami) default to empty via the
      # Dockerfile ARGs when the corresponding `vars.*` are unset.
      #
      # THESE LISTS — not docker-compose.prod.yml — are what actually builds the
      # deployed images. compose's `build.args` only run on a manual
      # `docker compose up --build`, so a var added there and not here still
      # never reaches a deployed container. Whenever you add an `ARG` to a
      # frontend Dockerfile, add it in BOTH places or decide, in writing, that
      # empty is correct for this environment (TASK-348). Since TASK-494
      # `scripts/env-check.js --audit` (check 3c) enforces it: every key the
      # prod compose passes in `build.args` must appear in each matching
      # `build-args:` list below, and nothing the env table does not know.
      #
      # Sentry (TASK-737): the trace rate and the ORG/PROJECT/AUTH_TOKEN trio were
      # missing here, so deployed frontends traced 0 % and uploaded no source maps
      # whatever the operator set. All four are optional: an empty
      # SENTRY_AUTH_TOKEN makes @sentry/nextjs skip the upload with a warning (it
      # never fails `next build`, and a failed upload is logged, not thrown).
      #
      # SENTRY_AUTH_TOKEN travels as a build ARG, and this repository is PUBLIC.
      # docker/build-push-action@v6 publishes build-arg VALUES in THREE places by
      # default, and all three are closed on every step that carries the token.
      # None of these lines is decoration — do not drop one:
      #   1. `provenance: mode=min` — the default on a public repo is a
      #      `mode=max` provenance attestation pushed to GHCR next to the image,
      #      and max mode records every build-arg value. min mode omits them.
      #   2. `DOCKER_BUILD_RECORD_UPLOAD: false` — the post step exports the
      #      buildx history record (build args with their resolved values) and
      #      uploads it as a workflow ARTIFACT, which anyone who can read a
      #      public repo can download.
      #   3. `DOCKER_BUILD_SUMMARY: false` — the job summary lists the build
      #      inputs, build-args included; false also skips the record export.
      # GitHub's log masking hides the secret in the step log, not in these.
      # The proper fix is a BuildKit secret mount (`secrets:` input +
      # `RUN --mount=type=secret`) instead of an ARG; until the Dockerfiles take
      # one, all three lines stay.
      - name: Build & push store-client
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/store-client/Dockerfile
          push: true
          provenance: mode=min
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=https://${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_CURRENCY=${{ vars.NEXT_PUBLIC_CURRENCY || 'UAH' }}
            NEXT_PUBLIC_IMAGE_HOSTS=${{ vars.NEXT_PUBLIC_IMAGE_HOSTS }}
            NEXT_PUBLIC_PAYMENT_METHODS=${{ vars.NEXT_PUBLIC_PAYMENT_METHODS }}
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || '0' }}
            NEXT_PUBLIC_UMAMI_SRC=${{ vars.NEXT_PUBLIC_UMAMI_SRC }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ steps.img.outputs.prefix }}/store-client:${{ steps.img.outputs.tag_sha }}
            ${{ steps.img.outputs.prefix }}/store-client:staging-latest
          cache-from: type=gha,scope=store-client
          cache-to: type=gha,mode=max,scope=store-client

      - name: Build & push store-admin
        uses: docker/build-push-action@v6
        env: # keep SENTRY_AUTH_TOKEN out of the public artifact + summary — see store-client
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/store-admin/Dockerfile
          push: true
          provenance: mode=min # build-arg values stay out of the attestation — see store-client
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_ADMIN_URL=https://admin.${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=https://${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_UMAMI_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_UMAMI_DASHBOARD_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || '0' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ steps.img.outputs.prefix }}/store-admin:${{ steps.img.outputs.tag_sha }}
            ${{ steps.img.outputs.prefix }}/store-admin:staging-latest
          cache-from: type=gha,scope=store-admin
          cache-to: type=gha,mode=max,scope=store-admin

      # ── sync the deploy files to the server ──────────────────────────────
      # The server keeps only what `docker compose` needs at /opt/case-store
      # (both compose files + Caddyfile + the postgres init dir). Copying them
      # on every deploy guarantees the running stack matches THIS commit — no
      # git checkout or registry auth is required on the server for the sync.
      - name: Copy deploy files to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,docker-compose.staging.yml,Caddyfile,Caddyfile.staging,docker,scripts"
          target: /opt/case-store
          overwrite: true

      # ── deploy on the server: env → pull → up → db push ──────────────────
      - name: Deploy on staging
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.img.outputs.tag_sha }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_ACTOR,GHCR_TOKEN,STAGING_ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/case-store

            # 1. Materialise the runtime env file from the single Environment
            #    secret (a complete, filled-in .env.production as one blob).
            #    umask keeps it private; GitHub masks the value in the logs.
            umask 077
            printf '%s' "$STAGING_ENV_FILE" > .env.production

            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml --env-file .env.production"

            # 2. Log in to GHCR so compose can PULL the private images. The
            #    workflow's GITHUB_TOKEN is valid for the life of this run.
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # 3. Back up the database BEFORE touching anything (TASK-308).
            #    On staging this is a REHEARSAL, so it must not block the first
            #    deploy on having B2 and an age key set up — the point of staging
            #    is to be able to look at the site. But it runs on every deploy so
            #    that by the time production depends on this script, it has already
            #    proven itself dozens of times. In the production job the same step
            #    is BLOCKING: no fresh backup, no migration.
            if [ -x ./scripts/backup.sh ]; then
              ./scripts/backup.sh --db-only || \
                echo "WARNING: staging backup failed. Harmless here (staging data is disposable) — but FIX IT before production relies on it. See docs/deploy/08-backup-restore.md."
            fi

            # 4. Pull the exact SHA-tagged images and roll the stack.
            export IMAGE_TAG
            $COMPOSE pull
            $COMPOSE up -d

            # 5. Apply the schema by replaying the committed migration history
            #    (TASK-303). This is the SAME command production runs, which is
            #    the point: staging is only a rehearsal if it rehearses the real
            #    thing. `migrate deploy` never drops data and refuses to run on a
            #    database whose history diverges — it fails the deploy instead of
            #    silently reshaping the schema, which `db push --accept-data-loss`
            #    (used here before) would happily do. The store-api image ships the
            #    pinned prisma CLI as a runtime dependency, so this runs the
            #    in-image binary — no network download, non-root.
            #
            #    ONE-TIME: the pre-TASK-303 staging volume was built by `db push`,
            #    so it has no `_prisma_migrations` bookkeeping table and this step
            #    will fail against it with "relation already exists". Wipe it once,
            #    deliberately, before the first deploy after this change:
            #      $COMPOSE down -v && $COMPOSE up -d
            #    Staging data is disposable; see docs/deploy/05-first-deploy.md.
            #    `--config`, not `--schema`: the datasource url lives in
            #    prisma.config.ts, not in schema.prisma. The image's WORKDIR is
            #    /app/apps/store-api, where that config sits.
            $COMPOSE exec -T store-api npx prisma migrate deploy \
              --config prisma.config.ts

            # 6. Drop dangling images from previous deploys (keeps tagged
            #    staging-<sha> images for rollback) and log out of GHCR.
            docker image prune -f
            docker logout ghcr.io || true

      # ── smoke check from the runner, against the public URLs ─────────────
      # Exercises DNS + Caddy TLS + each app end-to-end. Retries because Caddy
      # can take a moment to provision Let's Encrypt certs and containers to
      # become ready. Fails the job loudly if any app is not 2xx/3xx in time.
      #
      # Staging sits behind basic auth (TASK-307), so the storefront and admin
      # need credentials — WITHOUT them every check would come back 401 and the
      # smoke test would tell you nothing about whether the apps actually work.
      # `/health` is exempt from the password precisely so it stays reachable.
      - name: Smoke check the three apps
        env:
          DOMAIN: ${{ vars.STAGING_DOMAIN }}
          BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
        run: |
          set -u
          auth=""
          if [ -n "${BASIC_AUTH_PASSWORD}" ]; then
            auth="--user staging:${BASIC_AUTH_PASSWORD}"
          fi

          urls="https://api.${DOMAIN}/health https://${DOMAIN}/ https://admin.${DOMAIN}/"
          for url in $urls; do
            ok=0
            for i in $(seq 1 15); do
              # shellcheck disable=SC2086
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 $auth "$url" || true)"
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                echo "OK   ${url}  (HTTP ${code})"; ok=1; break
              fi
              if [ "$code" = "401" ]; then
                echo "SMOKE FAILED: ${url} returned 401."
                echo "Staging is password-protected. Add the plaintext password as the"
                echo "STAGING_BASIC_AUTH_PASSWORD secret so this check can reach the apps."
                exit 1
              fi
              echo "wait ${url}  (attempt ${i}, HTTP ${code})"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "SMOKE FAILED: ${url}"; exit 1; }
          done

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "### Staging deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image tag: \`${{ steps.img.outputs.tag_sha }}\`"
            echo "- Storefront: https://${{ vars.STAGING_DOMAIN }}/"
            echo "- Admin: https://admin.${{ vars.STAGING_DOMAIN }}/"
            echo "- API health: https://api.${{ vars.STAGING_DOMAIN }}/health"
            echo ""
            echo "Staging is behind basic auth — user \`staging\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # deploy-production (TASK-310)
  #
  # Mirrors deploy-staging, with four deliberate differences:
  #
  #   1. MANUAL APPROVAL. The `production` Environment carries a required-reviewer
  #      protection rule, so this job PAUSES and waits for a human to click
  #      Approve in the Actions UI. Nothing else in the workflow enforces that —
  #      the gate is the Environment setting, and it must be configured once in
  #      the repo settings (see docs/deploy/04-secrets-ci.md).
  #
  #   2. A BACKUP IS TAKEN FIRST, AND IT IS BLOCKING. If the backup fails, the
  #      deploy stops. A schema migration you cannot undo, run against a database
  #      you have no fresh copy of, is the one mistake with no way back.
  #
  #   3. `prisma migrate deploy` ONLY. Never `db push --accept-data-loss`, which
  #      staging used to use — it silently drops whatever is in the way.
  #
  #   4. SELECTIVE BUILDS. Each image is tagged with the SHA of the last commit
  #      that touched ITS OWN inputs, so an unchanged app keeps its previous tag,
  #      compose sees the same image reference, and the container is not recreated
  #      at all. A storefront-only change therefore leaves the API and admin
  #      running untouched — no restart, no dropped requests. (The old scheme
  #      tagged all three with the pushed commit's SHA, so every deploy looked like
  #      a change to all three, and all three restarted.)
  #
  # Its `needs:` test jobs ALWAYS run on the two events that can reach it (a
  # push to `main`, workflow_dispatch) — the `changes` job forces a full run
  # there, so a docs-only merge to main cannot silently skip a production
  # deploy or a manual re-run (TASK-455).
  # ──────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test-unit, test-e2e, test-int]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
      || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_swagger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Same guard as the staging job, same reason: the image builds push before
      # any step reads a secret, so an unprovisioned target must stop the job
      # BEFORE anything reaches GHCR.
      - name: Production must be configured
        env:
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          missing=""
          [ -n "$PROD_DOMAIN" ] || missing="$missing vars.PROD_DOMAIN"
          [ -n "$SSH_HOST" ] || missing="$missing secrets.SSH_HOST"
          if [ -n "$missing" ]; then
            echo "::error::Production is not provisioned yet — missing:$missing."
            echo "Nothing was built or published. See docs/deploy/04-secrets-ci.md."
            exit 1
          fi
          echo "Production target: $PROD_DOMAIN"

      - uses: actions/checkout@v4
        with:
          # Full history: the per-app tags below are computed from `git log`, and
          # a shallow clone would silently resolve them all to the tip commit —
          # turning selective deploys back into "rebuild everything".
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # swagger.json is committed (TASK-325), but re-export it anyway so the
      # images are a function of the API source rather than of the committed
      # spec — see the longer rationale on the staging job's equivalent step.
      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      - name: Export OpenAPI spec into the build context
        run: npm run swagger:export -w apps/store-api
        env:
          # Identical to the contract-freshness job's block by design — see the
          # comment there. Every one of these is required, not optional:
          # env.validation refuses a production boot without them, and the export
          # exits 1 and takes the whole deploy with it. CSRF_SECRET was found
          # while closing TASK-325; STORE_CLIENT_URL, REVALIDATE_SECRET and
          # STOREFRONT_REVALIDATE_URL while closing TASK-461. None of it ever
          # surfaced, because no deploy has ever run.
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_swagger?schema=public
          JWT_SECRET: ci-dummy-jwt-secret-min-32-chars-000000
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-min-32-000
          CSRF_SECRET: ci-dummy-csrf-secret-min-32-chars-0000
          CORS_ORIGINS: http://localhost:3000
          STORE_CLIENT_URL: http://localhost:3000
          STORE_ADMIN_URL: http://localhost:3002
          REVALIDATE_SECRET: ci-dummy-revalidate-secret-min-32-0000
          STOREFRONT_REVALIDATE_URL: http://localhost:3000/api/revalidate

      # ── per-app image tags ───────────────────────────────────────────────
      # Each tag is the SHA of the last commit that touched that app's inputs, so
      # it is a pure function of the code — no state, no bookkeeping, and the same
      # commit always produces the same tag.
      #
      # The frontends list apps/store-api/src among their inputs on purpose: they
      # bake Orval-generated hooks from store-api's Swagger surface at build time,
      # so an API DTO change genuinely does invalidate them. Erring the other way
      # would ship a frontend whose client no longer matches the API it calls.
      - name: Compute image coordinates
        id: img
        run: |
          owner_lc="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${owner_lc}" >> "$GITHUB_OUTPUT"

          shared="packages package-lock.json package.json"
          api_inputs="apps/store-api ${shared}"
          client_inputs="apps/store-client apps/store-api/src ${shared}"
          admin_inputs="apps/store-admin apps/store-api/src ${shared}"

          # shellcheck disable=SC2086
          {
            echo "tag_api=prod-$(git log -1 --format=%H -- ${api_inputs})"
            echo "tag_client=prod-$(git log -1 --format=%H -- ${client_inputs})"
            echo "tag_admin=prod-$(git log -1 --format=%H -- ${admin_inputs})"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image whose tag already exists in the registry is byte-for-byte the one
      # we would rebuild, so skip it. This is what makes the deploy selective.
      - name: Decide which images need building
        id: need
        run: |
          for app in api client admin; do
            case "$app" in
              api)    tag="${{ steps.img.outputs.tag_api }}" ;;
              client) tag="${{ steps.img.outputs.tag_client }}" ;;
              admin)  tag="${{ steps.img.outputs.tag_admin }}" ;;
            esac
            image="${{ steps.img.outputs.prefix }}/store-${app}:${tag}"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "${app}=false" >> "$GITHUB_OUTPUT"
              echo "store-${app}: unchanged — reusing ${tag}"
            else
              echo "${app}=true" >> "$GITHUB_OUTPUT"
              echo "store-${app}: CHANGED — will build ${tag}"
            fi
          done

      - name: Build & push store-api
        if: steps.need.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/store-api/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.prefix }}/store-api:${{ steps.img.outputs.tag_api }}
          cache-from: type=gha,scope=store-api
          cache-to: type=gha,mode=max,scope=store-api

      # As on staging: THIS list, not docker-compose.prod.yml, is what bakes the
      # deployed bundle. NEXT_PUBLIC_PAYMENT_METHODS in particular must be set in
      # the `production` Environment's variables when card payment goes live —
      # unset, the checkout offers cash on delivery only, whatever LiqPay keys
      # store-api holds (TASK-348). NEXT_PUBLIC_GOOGLE_AUTH_ENABLED is the same
      # shape and was missing from this list entirely until TASK-495: set it to
      # `true` when store-api has real GOOGLE_CLIENT_ID/_SECRET, or the
      # "Sign in with Google" button stays hidden no matter what the API holds.
      # The Sentry lines, `provenance: mode=min` and the two DOCKER_BUILD_* env
      # lines are TASK-737 — see the staging block for why all three must stay
      # while SENTRY_AUTH_TOKEN travels as a build arg in a public repo.
      - name: Build & push store-client
        if: steps.need.outputs.client == 'true'
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/store-client/Dockerfile
          push: true
          provenance: mode=min
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.PROD_DOMAIN }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.PROD_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=https://${{ vars.PROD_DOMAIN }}
            NEXT_PUBLIC_CURRENCY=${{ vars.NEXT_PUBLIC_CURRENCY || 'UAH' }}
            NEXT_PUBLIC_IMAGE_HOSTS=${{ vars.NEXT_PUBLIC_IMAGE_HOSTS }}
            NEXT_PUBLIC_PAYMENT_METHODS=${{ vars.NEXT_PUBLIC_PAYMENT_METHODS }}
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || '0' }}
            NEXT_PUBLIC_UMAMI_SRC=${{ vars.NEXT_PUBLIC_UMAMI_SRC }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.img.outputs.prefix }}/store-client:${{ steps.img.outputs.tag_client }}
          cache-from: type=gha,scope=store-client
          cache-to: type=gha,mode=max,scope=store-client

      - name: Build & push store-admin
        if: steps.need.outputs.admin == 'true'
        uses: docker/build-push-action@v6
        env: # keep SENTRY_AUTH_TOKEN out of the public artifact + summary — see staging store-client
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/store-admin/Dockerfile
          push: true
          provenance: mode=min # build-arg values stay out of the attestation — see staging store-client
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.PROD_DOMAIN }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.PROD_DOMAIN }}
            NEXT_PUBLIC_ADMIN_URL=https://admin.${{ vars.PROD_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=https://${{ vars.PROD_DOMAIN }}
            NEXT_PUBLIC_UMAMI_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_UMAMI_DASHBOARD_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || '0' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.img.outputs.prefix }}/store-admin:${{ steps.img.outputs.tag_admin }}
          cache-from: type=gha,scope=store-admin
          cache-to: type=gha,mode=max,scope=store-admin

      - name: Copy deploy files to production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,Caddyfile,docker,scripts"
          target: /opt/case-store
          overwrite: true

      - name: Deploy on production
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG_API: ${{ steps.img.outputs.tag_api }}
          TAG_CLIENT: ${{ steps.img.outputs.tag_client }}
          TAG_ADMIN: ${{ steps.img.outputs.tag_admin }}
          IMAGE_PREFIX: ${{ steps.img.outputs.prefix }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG_API,TAG_CLIENT,TAG_ADMIN,IMAGE_PREFIX,GHCR_ACTOR,GHCR_TOKEN,PROD_ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/case-store

            umask 077
            printf '%s' "$PROD_ENV_FILE" > .env.production

            # Pin each service to its own tag. An app whose code did not change
            # keeps the tag it is already running, so `up -d` leaves its container
            # completely alone — it is not restarted and serves throughout.
            cat > docker-compose.images.yml <<YAML
            services:
              store-api:
                image: ${IMAGE_PREFIX}/store-api:${TAG_API}
              store-client:
                image: ${IMAGE_PREFIX}/store-client:${TAG_CLIENT}
              store-admin:
                image: ${IMAGE_PREFIX}/store-admin:${TAG_ADMIN}
            YAML

            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.images.yml --env-file .env.production"

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # BACKUP FIRST, AND IT BLOCKS. `set -e` plus this script's own non-zero
            # exit on failure means a failed backup stops the deploy here, before a
            # single migration runs. Migrating a database you have no fresh copy of
            # is the one mistake that has no way back.
            ./scripts/backup.sh --db-only

            $COMPOSE pull
            $COMPOSE up -d

            # migrate deploy ONLY — never `db push --accept-data-loss`. It refuses
            # to run against a database whose history diverged rather than reshaping
            # it, so a bad state fails the deploy instead of destroying data.
            $COMPOSE exec -T store-api npx prisma migrate deploy --config prisma.config.ts

            docker image prune -f
            docker logout ghcr.io || true

      - name: Smoke check the three apps
        env:
          DOMAIN: ${{ vars.PROD_DOMAIN }}
        run: |
          set -u
          urls="https://api.${DOMAIN}/health https://${DOMAIN}/ https://admin.${DOMAIN}/"
          for url in $urls; do
            ok=0
            for i in $(seq 1 15); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                echo "OK   ${url}  (HTTP ${code})"; ok=1; break
              fi
              echo "wait ${url}  (attempt ${i}, HTTP ${code})"; sleep 10
            done
            [ "$ok" = 1 ] || {
              echo "SMOKE FAILED: ${url}"
              echo "Roll back now — do not retry blindly. See docs/deploy/07-rollback.md."
              exit 1
            }
          done

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- store-api: \`${{ steps.img.outputs.tag_api }}\` (built: ${{ steps.need.outputs.api }})"
            echo "- store-client: \`${{ steps.img.outputs.tag_client }}\` (built: ${{ steps.need.outputs.client }})"
            echo "- store-admin: \`${{ steps.img.outputs.tag_admin }}\` (built: ${{ steps.need.outputs.admin }})"
            echo ""
            echo "\`built: false\` means that app was unchanged and its container was never restarted."
            echo ""
            echo "To roll back, re-run with the previous tags — see docs/deploy/07-rollback.md."
          } >> "$GITHUB_STEP_SUMMARY"
