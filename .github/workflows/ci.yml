name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_CURRENCY: UAH
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3002

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Root `test` delegates to all three workspaces — store-api (Jest),
      # store-client (Jest unit + RTL/MSW component projects), store-admin (Jest).
      - run: npm run test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      # `--config`, not `--schema`: schema.prisma's datasource block carries no url
      # (it comes from prisma.config.ts), so a root-cwd `--schema` invocation fails
      # with "datasource.url property is required" before applying anything (TASK-303).
      - run: npx prisma migrate deploy --config apps/store-api/prisma.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_test
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_test

  test-e2e-playwright:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-unit]
    # Non-blocking while the full-stack harness (web servers + seeded DB) is
    # being stabilized. Remove once it has proven reliable over several runs.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_test
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      # `--config`, not `--schema`: schema.prisma's datasource block carries no url
      # (it comes from prisma.config.ts), so a root-cwd `--schema` invocation fails
      # with "datasource.url property is required" before applying anything (TASK-303).
      - run: npx prisma migrate deploy --config apps/store-api/prisma.config.ts
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts boots the API + storefront (webServer) and seeds the
      # DB via globalSetup before running the specs.
      - run: npm run test:e2e:pw

  test-int:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      # `--config`, not `--schema`: schema.prisma's datasource block carries no url
      # (it comes from prisma.config.ts), so a root-cwd `--schema` invocation fails
      # with "datasource.url property is required" before applying anything (TASK-303).
      - run: npx prisma migrate deploy --config apps/store-api/prisma.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_test
      - run: npm run test:int -w apps/store-api
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/store_test

  # ──────────────────────────────────────────────────────────────────────────
  # deploy-staging (TASK-271) — build the three app images, push to GHCR, then
  # SSH into the staging VPS and roll the stack.
  #
  # TRIGGER: runs ONLY on a push to `develop` and ONLY after the blocking test
  # jobs above are green. The `needs:` graph IS the "after green CI" gate — no
  # extra webhook/polling. `test-e2e-playwright` is deliberately NOT in `needs:`
  # (it is `continue-on-error` and must never gate a deploy).
  #
  # FIRST REAL DEPLOY IS MANUAL: this job cannot run until the owner provisions
  # the VPS, points DNS, and fills the `staging` GitHub Environment (4 secrets +
  # STAGING_DOMAIN). See docs/deploy.md and docs/manual-qa-pending.md §16.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test-unit, test-e2e, test-int]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    concurrency:
      # One staging deploy at a time. cancel-in-progress:false QUEUES a second
      # push rather than killing an in-flight `docker compose up` (which could
      # leave the stack half-restarted).
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # push/pull GHCR images with the built-in GITHUB_TOKEN
    services:
      # Throwaway Postgres — ONLY so `swagger:export` can boot AppModule
      # (PrismaService.$connect() opens a real connection). No schema/tables are
      # needed: the export just connects and reads Swagger decorator metadata,
      # and SearchService.onModuleInit returns early when Meili is unconfigured,
      # so nothing queries a table at boot. Mirrors the test-e2e/test-int env.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_swagger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # ── swagger.json gotcha (MUST run before any docker build) ────────────
      # apps/store-api/swagger.json is GITIGNORED, so a clean checkout does not
      # contain it — yet the store-client / store-admin Dockerfiles run
      # `npm run generate:api` INSIDE the image, and Orval reads that exact file
      # from the build context (../store-api/swagger.json). We therefore
      # regenerate it on the runner FIRST, the same way a local build would.
      # The existing `build` job does NOT do this (a pre-existing gap noted in
      # the TASK-271 handoff); we mirror the test jobs' env pattern instead:
      # `prisma generate` + a reachable Postgres + the two JWT secrets that env
      # validation requires. The dummy secrets below are throwaway build-time
      # inputs — never used at runtime.
      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/store-api/prisma/schema.prisma
      - name: Export OpenAPI spec into the build context
        run: npm run swagger:export -w apps/store-api
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store_swagger?schema=public
          JWT_SECRET: ci-dummy-jwt-secret-min-32-chars-000000
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-min-32-000

      # ── image coordinates ────────────────────────────────────────────────
      # GHCR requires a LOWERCASE path; the repo owner renders mixed-case
      # (Oleksii-Bidiak), so lowercase it once here (keep in sync with
      # docker-compose.staging.yml).
      - name: Compute image coordinates
        id: img
        run: |
          owner_lc="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=staging-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image is tagged twice: an immutable staging-<sha> (used for rollback)
      # and a floating staging-latest. context is the monorepo root (npm
      # workspaces) exactly like plan 123's Dockerfiles expect.
      - name: Build & push store-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/store-api/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}/store-api:${{ steps.img.outputs.tag_sha }}
            ${{ steps.img.outputs.prefix }}/store-api:staging-latest
          cache-from: type=gha,scope=store-api
          cache-to: type=gha,mode=max,scope=store-api

      # NEXT_PUBLIC_* are BAKED at build time → these images are tied to the
      # staging domain and can never be promoted to prod (prod builds its own).
      # Values come from the `staging` Environment's variables (public URLs, not
      # secrets). Optional vars (Sentry/Umami) default to empty via the
      # Dockerfile ARGs when the corresponding `vars.*` are unset.
      - name: Build & push store-client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/store-client/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=https://${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_CURRENCY=${{ vars.NEXT_PUBLIC_CURRENCY || 'UAH' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
            NEXT_PUBLIC_UMAMI_SRC=${{ vars.NEXT_PUBLIC_UMAMI_SRC }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          tags: |
            ${{ steps.img.outputs.prefix }}/store-client:${{ steps.img.outputs.tag_sha }}
            ${{ steps.img.outputs.prefix }}/store-client:staging-latest
          cache-from: type=gha,scope=store-client
          cache-to: type=gha,mode=max,scope=store-client

      - name: Build & push store-admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/store-admin/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_ADMIN_URL=https://admin.${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
          tags: |
            ${{ steps.img.outputs.prefix }}/store-admin:${{ steps.img.outputs.tag_sha }}
            ${{ steps.img.outputs.prefix }}/store-admin:staging-latest
          cache-from: type=gha,scope=store-admin
          cache-to: type=gha,mode=max,scope=store-admin

      # ── sync the deploy files to the server ──────────────────────────────
      # The server keeps only what `docker compose` needs at /opt/store-ai
      # (both compose files + Caddyfile + the postgres init dir). Copying them
      # on every deploy guarantees the running stack matches THIS commit — no
      # git checkout or registry auth is required on the server for the sync.
      - name: Copy deploy files to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,docker-compose.staging.yml,Caddyfile,Caddyfile.staging,docker,scripts"
          target: /opt/store-ai
          overwrite: true

      # ── deploy on the server: env → pull → up → db push ──────────────────
      - name: Deploy on staging
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.img.outputs.tag_sha }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_ACTOR,GHCR_TOKEN,STAGING_ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/store-ai

            # 1. Materialise the runtime env file from the single Environment
            #    secret (a complete, filled-in .env.production as one blob).
            #    umask keeps it private; GitHub masks the value in the logs.
            umask 077
            printf '%s' "$STAGING_ENV_FILE" > .env.production

            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml --env-file .env.production"

            # 2. Log in to GHCR so compose can PULL the private images. The
            #    workflow's GITHUB_TOKEN is valid for the life of this run.
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # 3. Back up the database BEFORE touching anything (TASK-308).
            #    On staging this is a REHEARSAL, so it must not block the first
            #    deploy on having B2 and an age key set up — the point of staging
            #    is to be able to look at the site. But it runs on every deploy so
            #    that by the time production depends on this script, it has already
            #    proven itself dozens of times. In the production job the same step
            #    is BLOCKING: no fresh backup, no migration.
            if [ -x ./scripts/backup.sh ]; then
              ./scripts/backup.sh --db-only || \
                echo "WARNING: staging backup failed. Harmless here (staging data is disposable) — but FIX IT before production relies on it. See docs/backup-restore.md."
            fi

            # 4. Pull the exact SHA-tagged images and roll the stack.
            export IMAGE_TAG
            $COMPOSE pull
            $COMPOSE up -d

            # 5. Apply the schema by replaying the committed migration history
            #    (TASK-303). This is the SAME command production runs, which is
            #    the point: staging is only a rehearsal if it rehearses the real
            #    thing. `migrate deploy` never drops data and refuses to run on a
            #    database whose history diverges — it fails the deploy instead of
            #    silently reshaping the schema, which `db push --accept-data-loss`
            #    (used here before) would happily do. The store-api image ships the
            #    pinned prisma CLI as a runtime dependency, so this runs the
            #    in-image binary — no network download, non-root.
            #
            #    ONE-TIME: the pre-TASK-303 staging volume was built by `db push`,
            #    so it has no `_prisma_migrations` bookkeeping table and this step
            #    will fail against it with "relation already exists". Wipe it once,
            #    deliberately, before the first deploy after this change:
            #      $COMPOSE down -v && $COMPOSE up -d
            #    Staging data is disposable; see docs/deploy.md.
            #    `--config`, not `--schema`: the datasource url lives in
            #    prisma.config.ts, not in schema.prisma. The image's WORKDIR is
            #    /app/apps/store-api, where that config sits.
            $COMPOSE exec -T store-api npx prisma migrate deploy \
              --config prisma.config.ts

            # 6. Drop dangling images from previous deploys (keeps tagged
            #    staging-<sha> images for rollback) and log out of GHCR.
            docker image prune -f
            docker logout ghcr.io || true

      # ── smoke check from the runner, against the public URLs ─────────────
      # Exercises DNS + Caddy TLS + each app end-to-end. Retries because Caddy
      # can take a moment to provision Let's Encrypt certs and containers to
      # become ready. Fails the job loudly if any app is not 2xx/3xx in time.
      - name: Smoke check the three apps
        env:
          DOMAIN: ${{ vars.STAGING_DOMAIN }}
        run: |
          set -u
          urls="https://api.${DOMAIN}/health https://${DOMAIN}/ https://admin.${DOMAIN}/"
          for url in $urls; do
            ok=0
            for i in $(seq 1 15); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                echo "OK   ${url}  (HTTP ${code})"; ok=1; break
              fi
              echo "wait ${url}  (attempt ${i}, HTTP ${code})"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "SMOKE FAILED: ${url}"; exit 1; }
          done

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "### Staging deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image tag: \`${{ steps.img.outputs.tag_sha }}\`"
            echo "- Storefront: https://${{ vars.STAGING_DOMAIN }}/"
            echo "- Admin: https://admin.${{ vars.STAGING_DOMAIN }}/"
            echo "- API health: https://api.${{ vars.STAGING_DOMAIN }}/health"
          } >> "$GITHUB_STEP_SUMMARY"
