services:
  postgres:
    image: postgres:17-alpine
    container_name: store_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-store_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-store_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - store_network

  redis:
    image: redis:7-alpine
    container_name: store_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      # Passed into the container so the entrypoint shell can decide whether to
      # enable auth. Empty by default (local dev) → Redis starts without a password.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Only append --requirepass when REDIS_PASSWORD is non-empty. The previous
    # `--requirepass ${REDIS_PASSWORD:-}` form passed a bare flag with no value
    # when the var was unset, crashing Redis ("'requirepass' wrong number of
    # arguments"). `$$` defers expansion to the container shell.
    command: >
      sh -c 'redis-server --appendonly yes
      $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - store_network

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: store_meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      # Master key gates all index/admin operations. Empty by default is rejected
      # in production mode, so a dev default is provided; override in .env.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyForLocalDevOnly32chars}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - store_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: store_pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@store.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - store_network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  meili_data:

networks:
  store_network:
    driver: bridge
