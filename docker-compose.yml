services:
  postgres:
    image: postgres:17-alpine
    container_name: store_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-store_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Bootstrap the extra `umami` database (TASK-261). Runs only on a fresh
      # volume; existing volumes need the manual fallback (see `umami` below).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-store_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - store_network

  redis:
    image: redis:7-alpine
    container_name: store_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      # Passed into the container so the entrypoint shell can decide whether to
      # enable auth. Empty by default (local dev) → Redis starts without a password.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Only append --requirepass when REDIS_PASSWORD is non-empty. The previous
    # `--requirepass ${REDIS_PASSWORD:-}` form passed a bare flag with no value
    # when the var was unset, crashing Redis ("'requirepass' wrong number of
    # arguments"). `$$` defers expansion to the container shell.
    command: >
      sh -c 'redis-server --appendonly yes
      $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - store_network

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: store_meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      # Master key gates all index/admin operations. Empty by default is rejected
      # in production mode, so a dev default is provided; override in .env.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyForLocalDevOnly32chars}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - store_network

  # Umami self-hosted analytics (TASK-261). Postgres-backed image variant — it
  # expects an external DATABASE_URL and stores its own schema in a separate
  # `umami` database inside the shared `postgres` container above.
  #
  # SECOND-DATABASE BOOTSTRAP: the `umami` database is auto-created by
  # docker/postgres-init/00-create-umami-db.sql ONLY on a fresh Postgres volume.
  # If you already have a populated volume, create it once by hand:
  #   docker exec store_postgres psql -U postgres -c "CREATE DATABASE umami"
  # then (re)start this service. Umami applies its own schema migrations on boot.
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    container_name: store_umami
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/umami
      # Signs Umami session/JWT cookies. Dev default below is fine for local use;
      # override in .env for anything shared — generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      APP_SECRET: ${UMAMI_APP_SECRET:-umamiAppSecretForLocalDevOnly32chars}
      # Opt out of Umami's OWN anonymous usage telemetry (unrelated to the
      # visitor data Umami collects for us).
      DISABLE_TELEMETRY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - store_network
    profiles:
      - analytics

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: store_pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@store.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - store_network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  meili_data:

networks:
  store_network:
    driver: bridge
