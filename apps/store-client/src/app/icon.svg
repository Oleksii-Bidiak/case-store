<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Brand favicon master (plan 145 / TASK-279-A, Design Decision 2).

    This file is BOTH a served asset (Next.js file-based metadata convention:
    <link rel="icon" type="image/svg+xml">) AND the single master source for
    every raster derivative (icon.png, apple-icon.png, favicon.ico,
    public/icons/*). Regenerate the derivatives after editing it:

        npm run generate:brand-assets -w apps/store-client

    Typographic placeholder until a designer logo lands: rounded square in the
    brand primary (#4f46e5, mirrors -\-color-primary / shared/config/theme.ts)
    with a white bold "M" monogram. System sans-serif on purpose - embedding
    Sora would bloat a favicon for no visible gain at 16-48px.
  -->
  <rect width="512" height="512" rx="112" fill="#4f46e5"/>
  <text
    x="256"
    y="372"
    text-anchor="middle"
    font-family="Arial, 'Helvetica Neue', 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="330"
    fill="#ffffff"
  >M</text>
</svg>
