<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Admin-panel favicon (TASK-430, AD-DASH-01).

    WHY THIS FILE EXISTS AT ALL: apps/store-admin had no public/ directory and no
    icon of any kind, so the browser tab was blank and every page load logged a
    404 for /favicon.ico. This is the Next 16 App Router file convention — an
    `icon.svg` directly in the app directory is served and injected as
    <link rel="icon" type="image/svg+xml"> automatically, no code and no
    public/ folder needed.

    WHY IT IS THE INVERSE OF THE STOREFRONT'S, NOT A COPY: the storefront icon
    (apps/store-client/src/app/icon.svg) is a SOLID #4f46e5 tile with a white "M".
    An operator runs both tabs side by side all day, and at 16px the only thing
    that separates two tabs is the dominant colour — so a second indigo tile would
    be worse than no icon: it would look like the shop and open the admin. This one
    inverts the pair: a dark slate ground (#0f172a, the panel's --color-foreground)
    with the indigo glyph on top, and an "A" for «Адмін» rather than the brand "M".
    Same family, unmistakably not the same tab.

    SVG ONLY, no .ico / .png derivatives: the storefront needs rasters because it
    is installable and shared (apple-icon, manifest, OG); the admin is a desktop
    tool behind a login in modern browsers, all of which take an SVG favicon.
    Adding PNG derivatives would mean running the storefront's sharp-based
    generator over a second master for no visible gain.
  -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <text
    x="256"
    y="368"
    text-anchor="middle"
    font-family="Arial, 'Helvetica Neue', 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="320"
    fill="#6366f1"
  >A</text>
</svg>
