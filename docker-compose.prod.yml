# ============================================================================
# docker-compose.prod.yml — production stack for the case-store monorepo (TASK-270)
#
# Brings up the three application images + their supporting infrastructure +
# Umami analytics + a Caddy reverse proxy (automatic HTTPS) behind three
# domains: the storefront (root), admin.<domain>, api.<domain>.
#
# Usage:
#   cp .env.production.example .env.production   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# All values come from `.env.production` (docker compose auto-loads `.env`; pass
# `--env-file .env.production` explicitly, or copy it to `.env`). App images are
# built from the monorepo root as context (npm workspaces). NEXT_PUBLIC_* values
# are baked at BUILD time — see the build.args blocks and .env.production.example.
#
# This file runs NO database migration. Applying the schema (`prisma migrate
# deploy`) is a deploy-time step owned by the deploy pipeline, not packaging.
# ============================================================================

# ─── Log rotation (TASK-309) ────────────────────────────────────────────────
# Docker's default json-file driver keeps logs FOREVER. On a small VPS that is
# the single most common way the box dies: nothing crashes, nothing alerts, the
# disk just fills up over months until Postgres cannot write and everything
# stops at once. 10 MB × 3 files × 8 services caps the whole stack at ~240 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ─── Memory limits (TASK-309) ───────────────────────────────────────────────
# Sized for a 4 GB VPS (e.g. Hetzner CX22), leaving ~800 MB for the host.
#
# The point is not to save memory — it is to decide WHO DIES. With no limits, a
# leaking Node process grows until the kernel's OOM killer fires, and the kernel
# picks its victim by size: usually Postgres, the biggest and most important
# process on the box. A leak in the storefront would take out the database. With
# limits, the container that misbehaves is the one that gets killed, and
# `restart: unless-stopped` brings it back while everything else keeps serving.
#
# Every value is overridable, so resizing the VPS does not mean editing this
# file: set e.g. MEM_STORE_API=1g in the env file.
# ============================================================================

# Compose project name — pinned so it no longer derives from the host directory
# basename (the server deploys from /opt/case-store). Keep prod and staging in
# sync; both run on their own host, so sharing the name across them is fine.
name: case-store

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: store_prod_postgres
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEM_POSTGRES:-768m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      # Creates the separate `umami` DB on a fresh volume (runs once). For an
      # already-initialised volume, create it once manually:
      #   docker compose -f docker-compose.prod.yml exec postgres \
      #     psql -U "$POSTGRES_USER" -c "CREATE DATABASE umami"
      - ./docker/postgres-init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - store_network

  # ─── Redis (cache + rate-limit store) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: store_prod_redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEM_REDIS:-192m}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # A password is REQUIRED in production (unlike dev). `$$` defers expansion to
    # the container shell so the value is never interpolated by compose.
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - store_network

  # ─── Meilisearch (full-text search; app falls back to Postgres if down) ─────
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: store_prod_meilisearch
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEM_MEILI:-384m}
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set (>=16 chars)}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_prod_data:/meili_data
    healthcheck:
      # The meilisearch image bundles curl and exposes an unauthenticated /health.
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - store_network

  # ─── Umami analytics (own DB in the shared Postgres) ────────────────────────
  # Mirrors TASK-261's dev umami service and shares its env-var contract. Kept on
  # the internal network + a loopback-only host port (dashboard via SSH tunnel);
  # to serve its tracking script publicly, add an `analytics.<domain>` Caddy
  # block and point NEXT_PUBLIC_UMAMI_SRC at it (future, owner's choice).
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    container_name: store_prod_umami
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEM_UMAMI:-256m}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET must be set}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Umami is a node image; use node's http client (curl/wget may be absent).
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/heartbeat',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - store_network

  # ─── store-api (NestJS) ─────────────────────────────────────────────────────
  store-api:
    build:
      context: .
      dockerfile: apps/store-api/Dockerfile
    image: store-api
    container_name: store_prod_api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEM_STORE_API:-640m}
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      # `postgres` is the service DNS name on store_network. URL-encode any
      # special chars in POSTGRES_PASSWORD.
      #
      # connection_limit (TASK-309): Prisma's pool was UNBOUNDED. Postgres allows
      # 100 connections by default, and Umami shares this server — so under load
      # the API could open enough of them to lock everyone (including itself) out
      # with "too many clients already", which looks exactly like a database
      # outage and is not one. 10 is ample for a single API container; raise it
      # with PRISMA_CONNECTION_LIMIT if a second one is ever added, keeping the
      # total well under 100. pool_timeout makes a saturated pool fail in 20s
      # instead of hanging a request forever.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=${PRISMA_CONNECTION_LIMIT:-10}&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>=32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set (>=32 chars)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET must be set (>=32 chars)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set (api public origin)}
      # Public origin of the STOREFRONT — where the API sends a person back to:
      # the Google-OAuth callback and the "reset your password" link in the email.
      # Deliberately NOT a variable of its own: it is the same origin as
      # NEXT_PUBLIC_APP_URL, and two independent variables for one origin drift
      # apart with certainty. Until TASK-324 nothing set it at all, so both
      # journeys silently used the code default `http://localhost:3000` — dead
      # links in production that no health check can see.
      STORE_CLIENT_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}
      UPLOAD_DEST: ${UPLOAD_DEST:-./uploads}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-60}
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NP_API_KEY: ${NP_API_KEY:-}
      NP_SENDER_CITY_REF: ${NP_SENDER_CITY_REF:-}
      # Dev/staging only — see .env.production.example. Production must fail loudly
      # on a missing NP key, not quietly ship at its own expense (TASK-337).
      NP_ALLOW_KEYLESS: ${NP_ALLOW_KEYLESS:-false}
      # Online payments (TASK-330). Empty keys = online payment unavailable and
      # checkout offers cash on delivery only; the app still boots.
      LIQPAY_PUBLIC_KEY: ${LIQPAY_PUBLIC_KEY:-}
      LIQPAY_PRIVATE_KEY: ${LIQPAY_PRIVATE_KEY:-}
      # Must stay false here: sandbox mode makes LiqPay report status "sandbox",
      # which counts as a successful payment.
      LIQPAY_SANDBOX: ${LIQPAY_SANDBOX:-false}
      LIQPAY_PAYTYPES: ${LIQPAY_PAYTYPES:-card,apay,gpay,privat24}
      PAYMENT_RECONCILE_CRON: ${PAYMENT_RECONCILE_CRON:-* * * * *}
      # Unpaid-online-order policy (owner decision 2026-07-28, open TASK-352).
      ORDER_RESERVATION_TTL_MINUTES: ${ORDER_RESERVATION_TTL_MINUTES:-30}
      ORDER_AUTOCANCEL_UNPAID: ${ORDER_AUTOCANCEL_UNPAID:-true}
      GUEST_ORDER_TOKEN_TTL_DAYS: ${GUEST_ORDER_TOKEN_TTL_DAYS:-60}
      # Encrypts TOTP secrets at rest (TASK-344). Losing it locks out every
      # enrolled admin — back it up with the age key.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      # Email verification link lifetime (TASK-342).
      EMAIL_VERIFICATION_TOKEN_EXPIRATION: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION:-24h}
      # How long the RBAC guard caches a role’s permissions — i.e. the longest a
      # revoked permission can still be honoured (TASK-334).
      RBAC_PERMISSION_CACHE_TTL_SECONDS: ${RBAC_PERMISSION_CACHE_TTL_SECONDS:-60}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      UMAMI_ORIGIN: ${UMAMI_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # ─── ISR revalidation (TASK-187) ──────────────────────────────────────
      # After an admin publishes/edits content the API POSTs to the storefront's
      # /api/revalidate so the affected pages are purged from the ISR cache. Both
      # sides must carry the SAME secret. Neither var was in this file until
      # TASK-324, which meant revalidation was DEAD in production: the route
      # answered 503 and every content change sat invisible behind the cache
      # until it expired on its own. Required (`:?`) rather than soft, because a
      # store whose admin panel does not visibly change the shop is broken in a
      # way nobody reports as an outage.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET must be set (>=32 chars, identical for store-api and store-client)}
      # Internal compose-network address: there is no reason to leave the bridge
      # network, terminate TLS at Caddy and come back in for a cache purge.
      STOREFRONT_REVALIDATE_URL: ${STOREFRONT_REVALIDATE_URL:-http://store-client:3000/api/revalidate}
      # ─── Google sign-in (TASK-168) ────────────────────────────────────────
      # SOFT on purpose (`:-`): the app boots without them and GoogleAuthGuard
      # answers 503, so an unfinished OAuth setup can never block a deploy. They
      # were declared in env.validation.ts and passed by nothing until TASK-324 —
      # i.e. Google sign-in was not configurable in production at all.
      # GOOGLE_CALLBACK_URL must match the "Authorized redirect URI" in Google
      # Cloud Console byte for byte, or Google refuses with redirect_uri_mismatch.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
    volumes:
      # Uploaded product images (TASK-093 image pipeline) — must survive redeploys.
      - uploads_data:/app/apps/store-api/uploads
    ports:
      # Loopback-only: local health/debug access. Public traffic goes via Caddy.
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${PORT:-3001}/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - store_network

  # ─── store-client (Next.js storefront) ──────────────────────────────────────
  store-client:
    build:
      context: .
      dockerfile: apps/store-client/Dockerfile
      # NEXT_PUBLIC_* are baked into the bundle at build time. A built image is
      # therefore tied to ONE API domain — rebuild to change NEXT_PUBLIC_API_URL.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-UAH}
        # Which payment methods the checkout offers (TASK-330). Empty → cash on
        # delivery only. Baked in like every NEXT_PUBLIC_*, so switching card
        # payments on means a rebuild — a temporary seam until the API exposes an
        # availability endpoint.
        NEXT_PUBLIC_PAYMENT_METHODS: ${NEXT_PUBLIC_PAYMENT_METHODS:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    image: store-client
    container_name: store_prod_client
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEM_STORE_CLIENT:-512m}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # RUNTIME vars — not NEXT_PUBLIC_*, so they are read by the server on each
      # request and are NOT baked into the browser bundle. That is why they live
      # here and not in build.args above.
      #
      # The shared secret the /api/revalidate route compares against; must be the
      # exact same value store-api sends (see its REVALIDATE_SECRET). Required,
      # because unset means the route fails closed with 503 in production and the
      # admin panel stops being able to update the shop.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET must be set (>=32 chars, identical for store-api and store-client)}
      # Optional: without it IndexNow pings are skipped, so Bing/Seznam pick up
      # new products on their own crawl schedule instead of within minutes.
      # Google ignores the protocol entirely. Nothing breaks when it is empty.
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      # How long a server-side fetch to the API may take before the page renders
      # its degraded state instead of hanging (TASK-327). The default lives in
      # the code; it is repeated here so the value is visible and tunable without
      # a rebuild. Build-time fetches are NOT covered — those would need a
      # Dockerfile ARG.
      SERVER_FETCH_TIMEOUT_MS: ${SERVER_FETCH_TIMEOUT_MS:-5000}
    ports:
      - "127.0.0.1:3000:3000"
    # Not health-gated: the storefront should still boot and degrade gracefully
    # if the API is briefly down, rather than refuse to start.
    depends_on:
      - store-api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - store_network

  # ─── store-admin (Next.js admin panel) ──────────────────────────────────────
  store-admin:
    build:
      context: .
      dockerfile: apps/store-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:?NEXT_PUBLIC_ADMIN_URL must be set}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    image: store-admin
    container_name: store_prod_admin
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEM_STORE_ADMIN:-384m}
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - store-api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3002/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - store_network

  # ─── Caddy reverse proxy (automatic HTTPS) ──────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: store_prod_caddy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEM_CADDY:-96m}
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set (e.g. mystore.ua or localhost)}
      PORT: ${PORT:-3001}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist ACME certs/account across redeploys — losing these would hit
      # Let's Encrypt rate limits on every deploy.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - store-client
      - store-admin
      - store-api
    healthcheck:
      # Caddy's admin API (localhost:2019) returns the running config JSON.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:2019/config/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - store_network

volumes:
  postgres_prod_data:
  redis_prod_data:
  meili_prod_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  store_network:
    driver: bridge
