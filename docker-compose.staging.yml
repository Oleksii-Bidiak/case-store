# ============================================================================
# docker-compose.staging.yml — staging OVERRIDE for docker-compose.prod.yml
# (TASK-271). Use it TOGETHER with the base file, base first:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml \
#     --env-file .env.production pull
#   docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml \
#     --env-file .env.production up -d
#
# WHY THIS FILE EXISTS
# --------------------
# The base docker-compose.prod.yml (TASK-270) names the three app services with
# LOCAL build tags (`image: store-api`, etc.) and a `build:` block — perfect for
# building on the host, but `docker compose pull` cannot fetch a local-only tag
# from a registry. Staging does NOT build on the server; the CI pipeline
# (.github/workflows/ci.yml → deploy-staging) builds the images and pushes them
# to GHCR, and the server only PULLS them. This override repoints the three app
# services at their GHCR coordinates so `pull` works, WITHOUT editing TASK-270's
# base file (it is owned by that task; this file is owned by TASK-271).
#
# IMAGE TAG
# ---------
# `IMAGE_TAG` selects which pushed build to run. The deploy job exports
# `IMAGE_TAG=staging-<commit-sha>` (immutable → used for rollback). Unset, it
# falls back to the floating `staging-latest` tag. To ROLL BACK, re-run `pull` +
# `up -d` with IMAGE_TAG set to a previous `staging-<sha>` (see docs/deploy.md).
#
# The base file's `build:` blocks remain but are never triggered here because we
# never pass `--build`; `up -d` uses the freshly pulled image. The base
# `build.args` `${NEXT_PUBLIC_* :?}` required-vars are still interpolated when
# compose parses the merged config, so `.env.production` MUST define every
# NEXT_PUBLIC_* (copy it from .env.production.example) even though those values
# are already baked into the images at build time and unused at runtime.
#
# OWNER PATH IS LOWERCASE
# -----------------------
# GHCR requires a lowercase image path. The repo owner renders mixed-case
# (`Oleksii-Bidiak`); the images are pushed to the lowercased `oleksii-bidiak`.
# Keep this in sync with the `deploy-staging` job's computed prefix.
# ============================================================================

services:
  store-api:
    image: ghcr.io/oleksii-bidiak/store-api:${IMAGE_TAG:-staging-latest}

  store-client:
    image: ghcr.io/oleksii-bidiak/store-client:${IMAGE_TAG:-staging-latest}

  store-admin:
    image: ghcr.io/oleksii-bidiak/store-admin:${IMAGE_TAG:-staging-latest}
